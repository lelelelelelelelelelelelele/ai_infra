default_model: gpt

providers:
  FREE:
    api_key_env: FREE_KEY
    # Relay swapped 2026-05-31: lastxianyi.zeabur.app returned 502, moved to
    # wherexianyi.zeabur.app (verified live, OpenAI /v1/chat/completions format).
    base_url: https://wherexianyi.zeabur.app/v1
  CHAT:
    api_key_env: CHAT_KEY
    base_url: https://api.chatanywhere.org/v1
  GEMINI:
    api_key_env: GEMINI_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  ST:
    api_key_env: ST_KEY
    base_url: https://spark-api-open.xf-yun.com/v1
  DASHSCOPE:
    api_key_env: DASHSCOPE_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

# Resolution (see _resolve_model_entry): exact key wins first; otherwise the
# first entry whose `match` substring appears in the requested name, in the
# insertion order below — so keep specific keys (qwen-coder) above broad ones
# (qwen, spark's "st").
#
# FREE relay (wherexianyi) probed 2026-05-31. Kept = fast + reliable:
#   qwen ~4s · qwen-coder ~6s · deepseek-flash ~5-25s · deepseek ~14s
# Dropped from FREE: gpt-oss-120b / Kimi-K2-Instruct / GLM-4.5 /
# tongyi-qwen3-max-model (dead or ~105s+), and mistral-medium-3.5 (weak at
# code + ignored instructions in testing).
#
# DASHSCOPE (paid) is NEVER auto-selected: the free-relay models do NOT fall
# back to it. It is reachable only via the explicit qwen-flash / qwen-max
# aliases (i.e. only when you name them on purpose).
models:
  # --- FREE relay (wherexianyi) ---
  qwen-coder:
    providers:
      - provider: FREE
        model: qwen/qwen3-coder-480b-a35b-instruct
    match: ["qwen-coder", "coder"]

  qwen:
    providers:
      - provider: FREE
        model: qwen/qwen3.5-397b-a17b
    match: ["qwen"]

  deepseek-flash:
    providers:
      - provider: FREE
        model: deepseek-ai/deepseek-v4-flash
    match: ["deepseek-flash"]

  deepseek:
    providers:
      - provider: FREE
        model: deepseek-ai/deepseek-v4-pro
    match: ["deepseek", "ds"]

  # --- other providers ---
  gpt:
    providers:
      - provider: CHAT
        model: gpt-5-mini
    match: ["gpt", "chatgpt"]

  gpt-4o-mini:
    providers:
      - provider: CHAT
        model: gpt-4o-mini
    match: ["gpt-4o-mini"]

  gemini:
    providers:
      - provider: GEMINI
        model: gemini-flash-latest
    match: ["gemini", "google"]

  spark:
    providers:
      - provider: ST
        model: lite
    match: ["st", "spark"]

  # Alibaba DashScope (needs DASHSCOPE_KEY; not on the relay)
  qwen-flash:
    providers:
      - provider: DASHSCOPE
        model: qwen-flash
    match: ["qwen-flash"]

  qwen-max:
    providers:
      - provider: DASHSCOPE
        model: qwen-max
    # only the exact key "qwen-max" routes here; bare "qwen*" hits the FREE qwen entry above
    match: ["qwen-max"]
